schema_version: 1

context:
  name: livox-sdk2
  version: "1.3.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/Livox-SDK/Livox-SDK2/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 749d31ca17460bb405d8d66b16386b653478a731774596f36b58282b0fcbe6cf
    patches:
      - 0001-update-cmake-minimum-version.patch
      - 0002-Add-missing-includes-for-ubuntu-24.04-comp.patch
      - 0003-unvendor-spdlog-and-rapidjson.patch
      - 0004-support-recent-fmt.patch
      - 0005-replace-posix-calls-on-win.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - pkg-config
    - ninja
  host:
    - fmt
    - rapidjson
    - spdlog

tests:
  - package_contents:
      files:
        - if: unix
          then:
            - include/livox_lidar_api.h
            - include/livox_lidar_def.h
            - include/livox_lidar_cfg.h
            - lib/liblivox_lidar_sdk_static.a
          else:
            - Library/include/livox_lidar_api.h
            - Library/include/livox_lidar_def.h
            - Library/include/livox_lidar_cfg.h
        - if: linux
          then:
            - lib/liblivox_lidar_sdk_shared.so
        - if: osx
          then:
            - lib/liblivox_lidar_sdk_shared.dylib
        - if: win
          then:
            - Library/lib/livox_lidar_sdk_static.lib

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Drivers for receiving LiDAR data and controlling lidar, support Lidar HAP and Mid-360.
  homepage: https://github.com/Livox-SDK/Livox-SDK2

extra:
  feedstock-name: livox-sdk2
  recipe-maintainers:
    - wep21
